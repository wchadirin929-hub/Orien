name: Build Orien Browser (Portable Windows x64)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build-windows:
    name: Build Orien Portable (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Configure Git Line Endings (Disable AutoCRLF)
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout Orien Source Code
        uses: actions/checkout@v4
        with:
          path: src/brave

      - name: Enable Windows Developer Mode & Long Paths
        shell: cmd
        run: |
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
          reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\FileSystem" /t REG_DWORD /f /v "LongPathsEnabled" /d "1"

      - name: Maximize Windows Runner Disk Space
        shell: pwsh
        run: |
          Write-Host "Freeing disk space on runner..."
          $pathsToRemove = @(
            "C:\Program Files\Android",
            "C:\Android",
            "C:\Program Files (x86)\Android",
            "C:\hostedtoolcache\windows\Ruby",
            "C:\hostedtoolcache\windows\Java",
            "C:\hostedtoolcache\windows\go"
          )
          foreach ($p in $pathsToRemove) {
            if (Test-Path $p) {
              Write-Host "Removing $p"
              Remove-Item -Recurse -Force $p -ErrorAction SilentlyContinue
            }
          }
          Get-PSDrive C

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Google depot_tools
        shell: pwsh
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
          echo "C:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "DEPOT_TOOLS_WIN_TOOLCHAIN=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fix Windows SDK Toolchain Paths
        shell: pwsh
        run: |
          $kitsRoot = "C:\Program Files (x86)\Windows Kits\10"
          $validSdk = Get-ChildItem -Path "$kitsRoot\include" -Directory | 
              Where-Object { Test-Path "$($_.FullName)\um" } | 
              Sort-Object Name -Descending | 
              Select-Object -First 1 -ExpandProperty Name
          Write-Host "Found valid Windows SDK: $validSdk"

          $targetVersions = @("10.0.28000.0", "10.0.26100.0", "10.0.22621.0")
          foreach ($targetVersion in $targetVersions) {
              foreach ($dir in @("include", "Lib", "bin")) {
                  $targetPath = "$kitsRoot\$dir\$targetVersion"
                  $sourcePath = "$kitsRoot\$dir\$validSdk"
                  if (Test-Path $sourcePath) {
                      if (Test-Path $targetPath) {
                          if (-not (Test-Path "$targetPath\um") -and -not (Test-Path "$targetPath\ucrt") -and ($targetPath -ne $sourcePath)) {
                              Remove-Item -Recurse -Force $targetPath -ErrorAction SilentlyContinue
                              cmd /c mklink /J "$targetPath" "$sourcePath"
                          }
                      } else {
                          cmd /c mklink /J "$targetPath" "$sourcePath"
                      }
                  }
              }
          }
          Write-Host "Verifying SDK directories:"
          Get-ChildItem -Path "$kitsRoot\include" | Select-Object Name

      - name: Initialize & Sync Dependencies
        working-directory: src/brave
        shell: cmd
        run: |
          set PATH=C:\depot_tools;%PATH%
          set DEPOT_TOOLS_WIN_TOOLCHAIN=0
          set NODE_OPTIONS=--experimental-strip-types
          call pnpm install
          node ./build/commands/scripts/sync.ts --init --no-history --lean_sync

      - name: Compile Orien Browser (Release Mode)
        working-directory: src/brave
        shell: cmd
        run: |
          set PATH=C:\depot_tools;%PATH%
          set DEPOT_TOOLS_WIN_TOOLCHAIN=0
          set NODE_OPTIONS=--experimental-strip-types
          call pnpm run build Release

      - name: Package Portable Orien Browser
        shell: pwsh
        run: |
          $candidates = @("src/out/Release", "src/brave/out/Release", "out/Release")
          $outDir = $candidates | Where-Object { Test-Path "$_\brave.exe" -or Test-Path "$_\orien.exe" -or (Test-Path "$_\chrome.exe") } | Select-Object -First 1
          if (-not $outDir) {
            $outDir = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          Write-Host "Packaging from outDir: $outDir"

          $distDir = "Orien-Portable-Windows-x64"
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null
          
          Copy-Item -Path "$outDir\*.exe" -Destination $distDir -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$outDir\*.dll" -Destination $distDir -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$outDir\*.pak" -Destination $distDir -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$outDir\*.bin" -Destination $distDir -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$outDir\icudtl.dat" -Destination $distDir -Force -ErrorAction SilentlyContinue
          if (Test-Path "$outDir\locales") { Copy-Item -Path "$outDir\locales" -Destination $distDir -Recurse -Force }
          if (Test-Path "$outDir\resources") { Copy-Item -Path "$outDir\resources" -Destination $distDir -Recurse -Force }

          if ((Test-Path "$distDir\brave.exe") -and (-not (Test-Path "$distDir\orien.exe"))) {
            Copy-Item -Path "$distDir\brave.exe" -Destination "$distDir\orien.exe" -Force
          }

          $launcherScript = @"
          @echo off
          title Membuka Orien Browser Portable...
          cd /d "%~dp0"
          if exist "orien.exe" (
              start "" "%~dp0orien.exe" --user-data-dir="%~dp0User_Data" %*
          ) else if exist "brave.exe" (
              start "" "%~dp0brave.exe" --user-data-dir="%~dp0User_Data" %*
          ) else (
              echo [ERROR] File executable Orien tidak ditemukan!
              pause
          )
          "@
          Set-Content -Path "$distDir\Buka-Orien.bat" -Value $launcherScript

          Compress-Archive -Path "$distDir\*" -DestinationPath "Orien-Browser-Portable-Windows-x64.zip" -CompressionLevel Optimal

      - name: Upload Orien Portable Zip to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Orien-Browser-Portable-Windows-x64
          path: Orien-Browser-Portable-Windows-x64.zip
          retention-days: 14
